name: Frontend checks

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lead_miner_ci

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
